<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Task App</title>
    <link rel="stylesheet" href="/todos/style-light.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1><span>My Task App</span></h1>
        <a href="/logout/" class="logout-btn">Logout Account</a>
      </header>

      <main>
        <form id="addTodoForm">
          <div class="inputDiv flex-note">
            <label>Task Objective</label>
            <input
              type="text"
              id="noteInput"
              class="input"
              placeholder="What is your focus?"
              required
            />
          </div>
          <div class="inputDiv flex-date">
            <label>Deadline (Optional)</label>
            <input type="datetime-local" id="deadlineInput" class="input" />
          </div>
          <button type="submit" class="add-btn">Add Task</button>
        </form>

        <table id="todoList">
          <thead>
            <tr>
              <th style="width: 5%"></th>
              <th style="width: 45%">Objective</th>
              <th style="width: 15%">Deadline</th>
              <th style="width: 25%">Timeline</th>
              <th style="width: 10%">Action</th>
            </tr>
          </thead>
          <tbody id="todoItems"></tbody>
        </table>
      </main>
    </div>

    <script type="module" src="./script.js"></script>
  </body>
</html>
